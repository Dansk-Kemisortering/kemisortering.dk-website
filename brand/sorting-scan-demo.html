<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animeret scanning – demo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F2E9; font-family: system-ui, sans-serif; color: #0E2A33; }
  main { width: min(520px, 92vw); }
  img { width: 100%; height: auto; display: block; border-radius: 28px; }
  p { font-size: 14px; color: #4D646C; }
  code { background: #E9E6D6; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <img src="../static/img/sorting-scan.svg" width="400" height="360"
       alt="Animation af automatisk sortering: produkter kører gennem en scanzone med tre kameraer, og navnet sættes på, når produktet er halvvejs gennem scanningen">
  <p>Animeret SVG (12 KB, ingen JavaScript). Respekterer «reducer bevægelse».
     På siden indsættes den som <code>&lt;img src="/img/sorting-scan.svg"&gt;</code>.</p>
</main>
</body>
</html>
